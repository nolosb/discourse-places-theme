en:
  theme_metadata:
    description: "A playful theme that adds banners and a handy sidebar to topic lists."
    settings:
      top_menu_banners:
        description: "The banner above the topic lists on the top menu pages, in place of core's welcome banner. Pick a page to give it its own banner; an entry without a page shows everywhere else."
        schema:
          properties:
            page:
              label: "Page"
              description: "The top menu page this banner is for. Leave empty to show it on every page without its own banner."
            title:
              label: "Title"
            description:
              label: "Description"
            image:
              label: "Image"
              description: "Shown whole at the banner's end, up to 40% of its width and the banner's inner height. Without one, Latest, New, Hot and Categories show a built-in illustration."
            image_dark:
              label: "Dark image"
              description: "Optional image for dark mode."
      places_panel:
        description: "Where the Places panel appears and where its “All places” link goes. Scope an entry to categories to show it only there; an entry without categories shows it everywhere."
        schema:
          properties:
            categories:
              label: "Categories"
            all_places_url:
              label: "All places link"
              description: "The page the panel’s “All places” link opens."
      resources_panel:
        description: "The links the Resources panel lists. Scope an entry to categories for links per place; an entry without categories applies everywhere else."
        schema:
          properties:
            categories:
              label: "Categories"
            links:
              label: "Links"
              schema:
                properties:
                  label:
                    label: "Label"
                  url:
                    label: "URL"
                    description: "Absolute, or a path on this site such as /guidelines."
                  icon:
                    label: "Icon"
                  description:
                    label: "Description"
      users_panel:
        description: "Which users the Users panel lists. The list comes from the user directory and counts activity across the whole site; scope an entry to categories to show a different list there. An entry without categories applies everywhere else."
        schema:
          properties:
            categories:
              label: "Categories"
            order:
              label: "Order"
              description: "What the users are ranked by. The panel title follows it. The matching column must be enabled in the user directory."
            period:
              label: "Period"
              description: "The time span the counts cover."
            group:
              label: "Group"
              description: "Only members of this group."
            count:
              label: "Number of users"
              description: "How many users the panel lists, up to 20."
  place:
    all_places: "Places"
    all_places_link: "All places"
    topic_count:
      one: "%{formatted_number} topic"
      other: "%{formatted_number} topics"
  panel:
    load_error: "Could not load this content. Please try again."
    retry: "Retry"
  users:
    title:
      likes_received: "Most loved"
      likes_given: "Most generous"
      topic_count: "Top starters"
      post_count: "Most active"
      topics_entered: "Most curious"
      posts_read: "Top readers"
      days_visited: "Regulars"
    empty: "No users yet"
    view_all: "View all"
  resources:
    title: "Good to know"
