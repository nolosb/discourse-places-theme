en:
  theme_metadata:
    description: "A playful theme that adds banners and a handy sidebar to topic lists."
    settings:
      top_menu_banners:
        description: "The banner above the topic lists on the top menu pages, in place of core's welcome banner. Pick a page to give it its own banner; an entry without a page shows everywhere else."
        schema:
          properties:
            page:
              label: "Page"
              description: "The top menu page this banner is for. Leave empty to show it on every page without its own banner."
            title:
              label: "Title"
            description:
              label: "Description"
            image:
              label: "Image"
              description: "Shown whole at the banner's end, up to 40% of its width and the banner's inner height. Without one, Latest, New and Hot show a built-in illustration."
            image_dark:
              label: "Dark image"
              description: "Optional image for dark mode."
      places_panel:
        description: "Where the Places panel appears and where its “All places” link goes. Scope an entry to categories to show it only there; an entry without categories shows it everywhere."
        schema:
          properties:
            categories:
              label: "Categories"
            all_places_url:
              label: "All places link"
              description: "The page the panel’s “All places” link opens."
      resources_panel:
        description: "The links the Resources panel lists. Scope an entry to categories for links per place; an entry without categories applies everywhere else."
        schema:
          properties:
            categories:
              label: "Categories"
            links:
              label: "Links"
              schema:
                properties:
                  label:
                    label: "Label"
                  url:
                    label: "URL"
                    description: "Absolute, or a path on this site such as /guidelines."
                  icon:
                    label: "Icon"
                  description:
                    label: "Description"
      topics_panel:
        description: "Which topics the Topics panel lists. Scope an entry to categories for a list per place; an entry without categories applies everywhere else."
        schema:
          properties:
            categories:
              label: "Categories"
            order:
              label: "Order"
              description: "Topics of the current top-level category, or of the whole site on global lists. Hot and activity use the hot and latest lists; the others sort the latest list."
            tag:
              label: "Tag"
              description: "Only topics with this tag."
  place:
    all_places: "Places"
    all_places_link: "All places"
    topic_count:
      one: "%{formatted_number} topic"
      other: "%{formatted_number} topics"
  panel:
    load_error: "Could not load this content. Please try again."
    retry: "Retry"
  topics:
    title: "Most loved"
    empty: "No topics yet"
    view_all: "View all"
  resources:
    title: "Good to know"
