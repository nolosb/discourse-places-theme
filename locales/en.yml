en:
  theme_metadata:
    description: "An upbeat, colorful community theme"
    settings:
      top_menu_banners:
        description: "The banner above the topic lists on the top menu pages, in place of core's welcome banner. Pick a page to give it its own banner; an entry without a page shows everywhere else."
        schema:
          properties:
            page:
              label: "Page"
              description: "The top menu page this banner is for. Leave empty to show it on every page without its own banner."
            title:
              label: "Title"
            description:
              label: "Description"
            image:
              label: "Image"
              description: "Shown whole at the banner's end, up to 40% of its width and the banner's inner height. Without one, Latest, New and Hot show a built-in illustration."
            image_dark:
              label: "Dark image"
              description: "Optional image for dark mode."
