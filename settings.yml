# The banner above the top menu lists. An entry scoped to a page applies on
# that page; the entry without a page everywhere else. With no unscoped entry
# the banner only shows on the scoped pages.
top_menu_banners:
  type: objects
  default:
    - title: "Welcome! 👋"
      description: "Good to see you! Join a conversation and meet new people."
    - page: new
      title: "Fresh in"
      description: "The newest topics since you last dropped by."
    - page: hot
      title: "Trending now"
      description: "What everyone's talking about right now."
    - page: categories
      title: "Explore places"
      description: "Look around, pick a place and see what's going on there."
  schema:
    name: banner
    identifier: title
    properties:
      page:
        type: enum
        choices:
          - latest
          - new
          - unread
          - unseen
          - top
          - hot
          - posted
          - bookmarks
          - read
          - categories
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      description:
        type: string
        validations:
          max_length: 300
      image:
        type: upload
      image_dark:
        type: upload

# Where the Places panel appears and where its "All places" link goes. An entry
# scoped to categories applies on those categories and their subcategories;
# the unscoped entry everywhere else. With no unscoped entry the panel only
# shows on the scoped categories.
places_panel:
  type: objects
  default:
    - all_places_url: "/"
  schema:
    name: place
    identifier: categories
    properties:
      categories:
        type: categories
      all_places_url:
        type: enum
        default: "/"
        choices:
          - "/"
          - "/latest"
          - "/categories"

# Which links the Resources panel lists. An entry scoped to categories applies
# on those categories and their subcategories; an unscoped entry everywhere else.
resources_panel:
  type: objects
  default:
    - links:
        - label: "Community guidelines"
          url: "/guidelines"
          icon: "circle-check"
          description: "How we treat each other here"
        - label: "Badges"
          url: "/badges"
          icon: "certificate"
          description: "What you can earn by taking part"
        - label: "About this site"
          url: "/about"
          icon: "circle-info"
          description: "Key stats and how to get in touch"
  schema:
    name: resources
    identifier: categories
    properties:
      categories:
        type: categories
      links:
        type: objects
        schema:
          name: link
          identifier: label
          properties:
            label:
              type: string
              required: true
            icon:
              type: icon
            description:
              type: string
            url:
              type: string
              required: true

# Which users the Users panel lists for a place. An entry scoped to
# categories applies on those categories and their subcategories; the unscoped
# entry everywhere else. The list comes from the user directory, which counts
# site-wide, so categories only pick where an entry shows.
users_panel:
  type: objects
  default:
    - order: posts_read
      period: all
      count: 5
  schema:
    name: user_list
    identifier: categories
    properties:
      categories:
        type: categories
      order:
        type: enum
        default: posts_read
        choices:
          - likes_received
          - likes_given
          - topic_count
          - post_count
          - topics_entered
          - posts_read
          - days_visited
      count:
        type: integer
        default: 5
        validations:
          min: 1
          max: 20
      period:
        type: enum
        default: all
        choices:
          - all
          - yearly
          - quarterly
          - monthly
          - weekly
          - daily
      group:
        type: groups
        validations:
          max: 1
